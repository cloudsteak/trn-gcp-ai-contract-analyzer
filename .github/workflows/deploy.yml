name: Deploy

on:
  push:
    branches:
      - main

env:
  GCP_REGION: europe-west4
  BACKEND_SERVICE: contract-analyzer-backend
  FRONTEND_SERVICE: contract-analyzer-frontend

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve RAG corpus
        id: rag
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          RAG_LOCATION="${GCP_REGION}"
          DISPLAY_NAME=contract-regulations
          CORPUS="$(curl -fsS \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://${RAG_LOCATION}-aiplatform.googleapis.com/v1/projects/${PROJECT_ID}/locations/${RAG_LOCATION}/ragCorpora?pageSize=100" \
            | python3 -c '
          import json, sys
          display = sys.argv[1]
          data = json.load(sys.stdin)
          for corpus in data.get("ragCorpora") or []:
              if corpus.get("displayName") == display:
                  print(corpus.get("name", ""))
                  break
          ' "${DISPLAY_NAME}")"
          if [[ -z "${CORPUS}" ]]; then
            echo "Hiba: nincs ${DISPLAY_NAME} RAG corpus. Futtasd: ./scripts/upload-doc-to-rag.sh"
            exit 1
          fi
          echo "corpus=${CORPUS}" >> "${GITHUB_OUTPUT}"

      - name: Deploy backend to Cloud Run
        working-directory: backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CICD_SA: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          RUNTIME_SA: contract-analyzer-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          gcloud run deploy "${BACKEND_SERVICE}" \
            --source . \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --service-account "${RUNTIME_SA}" \
            --build-service-account "projects/${PROJECT_ID}/serviceAccounts/${CICD_SA}" \
            --set-env-vars="GEMINI_MODEL=gemini-3.5-flash,GCP_PROJECT_ID=${PROJECT_ID},GEMINI_LOCATION=global,CORS_ORIGINS=*,RAG_ENABLED=true,RAG_CORPUS=${{ steps.rag.outputs.corpus }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve backend URL
        id: backend
        run: |
          BACKEND_URL="$(gcloud run services describe "${BACKEND_SERVICE}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')"
          echo "url=${BACKEND_URL}" >> "${GITHUB_OUTPUT}"

      - name: Deploy frontend to Cloud Run
        working-directory: frontend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CICD_SA: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          RUNTIME_SA: contract-analyzer-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --source . \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --service-account "${RUNTIME_SA}" \
            --build-service-account "projects/${PROJECT_ID}/serviceAccounts/${CICD_SA}" \
            --set-build-env-vars="VITE_API_URL=${{ steps.backend.outputs.url }}"
